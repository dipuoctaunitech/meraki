version: 1
applications:
  - appRoot: boutique_vton/frontend
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: boutique_vton/frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
